<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>Capzera 学情数据大屏</title>
    <script src="./echarts/echarts.min.js"></script>
    <style>
        /* 🚀 注入免安装黑科技字体 */
        @font-face { font-family: 'HYWenHei-65W'; src: url('qrc:///fonts/HYWenHei65W.ttf') format('truetype'); }
        @font-face { font-family: 'HYWenHei-85W'; src: url('qrc:///fonts/HYWenHei85W.ttf') format('truetype'); }

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; display: flex; font-family: "HYWenHei-65W", "Microsoft YaHei", sans-serif !important; }
        #bar-chart { flex: 6; height: 100%; min-width: 100px; }
        #pie-chart { flex: 4; height: 100%; min-width: 100px; }
    </style>
</head>
<body>
    <div id="bar-chart"></div>
    <div id="pie-chart"></div>

    <script>
        var barChart = echarts.init(document.getElementById('bar-chart'));
        var pieChart = echarts.init(document.getElementById('pie-chart'));

        var emptyOption = { title: { text: '📈 大屏引擎初始化中...', left: 'center', top: '45%', textStyle: { color: '#94A3B8', fontSize: 16, fontFamily: 'HYWenHei-85W' } } };
        barChart.setOption(emptyOption);
        pieChart.setOption(emptyOption);

        // 🚀 核心修复：升级为 Base64 解码器
        function updateDashboard(b64Str) {
            try {
                var jsonStr = new TextDecoder("utf-8").decode(Uint8Array.from(atob(b64Str), c => c.charCodeAt(0)));
                var data = JSON.parse(jsonStr);

                var barOption = {
                    title: { text: '📊 近期测验平均分走势', textStyle: { color: '#475569', fontSize: 18, fontFamily: 'HYWenHei-85W' }, left: 'center', top: '5%' },
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: 'rgba(30, 41, 59, 0.9)', textStyle: { color: '#F8FAFC' } },
                    grid: { left: '8%', right: '8%', bottom: '15%', top: '20%', containLabel: true },
                    xAxis: { type: 'category', data: data.barData.categories, axisLabel: { color: '#64748B', interval: 0, formatter: function(v){ return v.length > 6 ? v.substring(0,5)+'..' : v; } }, axisLine: { lineStyle: { color: '#CBD5E1' } } },
                    yAxis: { type: 'value', max: 100, splitLine: { lineStyle: { type: 'dashed', color: '#E2E8F0' } }, axisLabel: { color: '#64748B' } },
                    series: [{
                        data: data.barData.values, type: 'bar', barWidth: '45%',
                        itemStyle: { borderRadius: [8, 8, 0, 0], color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#3B82F6' }, { offset: 1, color: '#93C5FD' }]) },
                        animationDuration: 1500, animationEasing: 'cubicOut'
                    }]
                };

                var pieOption = {
                    title: { text: '🎯 历史成绩等级分布', textStyle: { color: '#475569', fontSize: 18, fontFamily: 'HYWenHei-85W' }, left: 'center', top: '5%' },
                    tooltip: { trigger: 'item', formatter: '{b} : {c}人 ({d}%)', backgroundColor: 'rgba(30, 41, 59, 0.9)', textStyle: { color: '#F8FAFC' } },
                    legend: { bottom: '5%', left: 'center', itemGap: 20, textStyle: { color: '#475569', fontFamily: 'HYWenHei-85W' } },
                    color: ['#10B981', '#3B82F6', '#F59E0B', '#EF4444'],
                    series: [{
                        name: '成绩分布', type: 'pie', radius: ['45%', '70%'], center: ['50%', '50%'],
                        avoidLabelOverlap: false, itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 },
                        label: { show: false }, emphasis: { label: { show: true, fontSize: '18', fontWeight: 'bold' } },
                        labelLine: { show: false }, data: data.pieData
                    }]
                };

                barChart.setOption(barOption);
                pieChart.setOption(pieOption);
            } catch (e) { console.error("大屏解析异常:", e); }
        }

        window.addEventListener('resize', function() { barChart.resize(); pieChart.resize(); });
    </script>
</body>
</html>
