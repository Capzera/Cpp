<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <link href="./tabulator/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="./tabulator/tabulator.min.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        @font-face { font-family: 'HYWenHei-65W'; src: url('qrc:///fonts/HYWenHei65W.ttf') format('truetype'); }
        @font-face { font-family: 'HYWenHei-85W'; src: url('qrc:///fonts/HYWenHei85W.ttf') format('truetype'); }
        html, body { height: 100%; margin: 0; padding: 10px; box-sizing: border-box; font-family: "HYWenHei-65W", sans-serif; background: transparent; overflow: hidden; }
        
        .tabulator { 
            border: none !important; 
            background: #FFFFFF !important; 
            font-size: 18px;
            font-family: "HYWenHei65W", sans-serif !important;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(148, 163, 184, 0.08);
            overflow: hidden;
        }
        
        /* 🚀 浅蓝高定表头结构 */
        .tabulator-header { 
            background: #DEEAFC !important; 
            border-bottom: 2px solid #CBD5E1 !important; 
            border-top: none !important; 
        }
        .tabulator-col { 
            background: transparent !important; 
            border-right: none !important; 
            border-left: none !important;
            padding: 16px 12px !important; 
            color: #1E293B !important; 
            font-weight: bold !important; 
            font-size: 16px !important; 
        }
        
        .tabulator-col-title {
            color: #1E293B !important;
            font-family: "HYWenHei-85W", sans-serif !important;
            font-size: 20px;
        }

        .tabulator-row { 
            border-bottom: 1px solid #F1F5F9 !important; 
            border-left: 4px solid transparent !important; 
            border-right: none !important;
            transition: all 0.25s ease; 
            cursor: pointer; 
        }
        
        .tabulator-row:nth-child(odd) { background-color: #FFFFFF !important; }
        .tabulator-row:nth-child(even) { background-color: #F8FAFC !important; }
        
        .tabulator-cell { 
            padding: 18px 14px !important; 
            border-right: none !important;
            border-left: none !important;
            color: #334155;
            vertical-align: middle !important;
        }
        
        .tabulator-row:hover { 
            background-color: #FFFFFF !important; 
            box-shadow: 0 6px 18 rgba(148,163,184,0.12); 
            transform: translateY(-1px); 
            z-index: 10; 
            position: relative; 
            border-left-color: #93C5FD !important; 
        }
        .tabulator-row.tabulator-selected { 
            background-color: #F0F9FF !important; 
            border-left: 4px solid #3B82F6 !important; 
        }
        
        .stu-count { font-family: "Consolas", "DengXian"; font-weight: bold; font-size: 18px; color: #3B82F6; }
    </style>
</head>
<body>
    <div id="class-table"></div>
    <script>
        var table;
        var cplusBridge = null;
        if (typeof qt !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function(channel) { cplusBridge = channel.objects.classTableBridge; });
        }

        var countFormatter = function(cell) { return "<span class='stu-count'>" + cell.getValue() + " 人</span>"; };

        table = new Tabulator("#class-table", {
            height: "100%", layout: "fitColumns", selectable: 1,
            placeholder: "<span style='color:#94A3B8; font-weight:bold;'>⏳ 暂无班级 data</span>",
            columns: [
                {title: "班级名称", field: "className", hozAlign: "center", vertAlign: "middle", headerHozAlign: "center", cssClass: "tabulator-col-title", headerSort: false},
                {title: "当前在班人数", field: "studentCount", hozAlign: "center", vertAlign: "middle", headerHozAlign: "center", formatter: countFormatter, headerSort: false}
            ],
        });

        table.on("rowClick", function(e, row) { if (cplusBridge) cplusBridge.onWebRowClicked(row.getData().className); });

        function loadTableData(b64Text) {
            var data = JSON.parse(decodeURIComponent(escape(atob(b64Text))));
            table.setData(data);
        }
    </script>
</body>
</html>
