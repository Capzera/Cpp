<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <script src="./echarts/echarts.min.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        /* 🚀 注入全局免安装高定字体 */
        @font-face { font-family: 'HYWenHei-65W'; src: url('qrc:///fonts/HYWenHei65W.ttf') format('truetype'); }
        @font-face { font-family: 'HYWenHei-85W'; src: url('qrc:///fonts/HYWenHei85W.ttf') format('truetype'); }

        html, body { height: 100%; margin: 0; padding: 20px; box-sizing: border-box; font-family: "HYWenHei-65W", "Microsoft YaHei", sans-serif; background: #FFFFFF; overflow-y: auto; color: #1E293B; }

        /* 占位提示区 */
        #placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94A3B8; font-size: 16px; font-weight: bold; text-align: center; font-family: "HYWenHei-85W", sans-serif; }

        /* 主内容区 */
        #main-content { display: none; height: 100%; flex-direction: column; }

        .header-section { border-bottom: 2px solid #F1F5F9; padding-bottom: 15px; margin-bottom: 20px; }
        .student-name { font-size: 28px; font-weight: bold; color: #2563EB; margin: 0 0 5px 0; font-family: "HYWenHei-85W", sans-serif; }
        .student-uid { font-size: 26px; font-family: Consolas, monospace; color: #64748B; }

        /* 高定两列网格表单（去行线、去列线、卡片呼吸感） */
        .info-grid { display: grid; grid-template-columns: repeat(2, 11fr); gap: 15px; margin-bottom: 25px; }
        .info-item { background: #F8FAFC; padding: 12px 16px; border-radius: 8px; display: flex; align-items: center; border: 1px solid #E2E8F0; }
        .info-label { width: 110px; color: #64748B; font-weight: bold; font-size: 18px; font-family: "HYWenHei-85W", sans-serif; }
        .info-value { flex: 1; color: #334155; font-size: 15px; }
        .info-value.motto-box { font-style: italic; color: #475569; }

        /* 特殊高定班级下拉框与按钮 */
        .cap-select { width: 100%; padding: 6px 10px; border: 1px solid #CBD5E1; border-radius: 6px; background: white; font-family: "HYWenHei-65W", sans-serif; font-size: 18px; color: #1E293B; outline: none; }
        .cap-select:focus { border-color: #3B82F6; }

        .action-bar { display: flex; gap: 10px; margin-top: 5px; }
        .cap-btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; font-size: 18px; font-family: "HYWenHei-85W", sans-serif; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background: #3B82F6; color: white; }
        .btn-primary:hover { background: #2563EB; }
        .btn-secondary { background: #E2E8F0; color: #475569; }
        .btn-secondary:hover { background: #CBD5E1; }
        .btn-danger { background: #EF4444; color: white; }
        .btn-danger:hover { background: #DC2626; }

        /* 折线图专属无缝区域 */
        .chart-section { flex: 1; min-height: 260px; margin-top: 15px; background: #FFFFFF; border-radius: 12px; }
        #history-chart { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="placeholder">
        <span> 请在左侧列表中点击学生以查看详细信息</span>
    </div>

<div id="main-content">
        <div class="header-section">
            <h2 class="student-name" id="info-name">--</h2>
            <div class="student-uid">UID: <span id="info-uid">--</span></div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">归属班级：</div>
                <div class="info-value">
                    <select class="cap-select" id="combo-class" onchange="actionChangeClass()">
                        </select>
                </div>
            </div>
            <div class="info-item">
                <div class="info-label">性别：</div>
                <div class="info-value" id="info-gender">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">注册时间：</div>
                <div class="info-value" id="info-reg-time">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">最近登录：</div>
                <div class="info-value" id="info-last-login">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">最近提交：</div>
                <div class="info-value" id="info-last-submit">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">手机号：</div>
                <div class="info-value" id="info-phone">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">E-Mail：</div>
                <div class="info-value" id="info-email">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">身份证号：</div>
                <div class="info-value" id="info-idcard">--</div>
            </div>
        </div>

        <div class="info-item" style="margin-bottom: 20px;">
            <div class="info-label">个人签名：</div>
            <div class="info-value motto-box" id="info-motto">--</div>
        </div>

        <div class="action-bar">
            <button class="cap-btn btn-secondary" onclick="actionResetPwd()">重置密码</button>
            <button class="cap-btn btn-danger" onclick="actionDeleteStudent()">账号注销</button>
        </div>

        <div class="chart-section">
            <div id="history-chart"></div>
        </div>
    </div>

    <script>
        var historyChart = null;
        var cplusBridge = null;

        // 绑定 Qt 通信通道
        if (typeof qt !== 'undefined') {
            new QWebChannel(qt.webChannelTransport, function(channel) {
                cplusBridge = channel.objects.coreStudentDetailBridge;
            });
        }

        // 🚀 终极防御解码与全量画像联动接口
        function loadStudentDetail(b64Str) {
            try {
                if(!b64Str) return;

                // 使用和左侧完全一致、能完美兼容中文和多维嵌套的解包引擎
                var jsonStr = decodeURIComponent(escape(atob(b64Str)));
                var data = JSON.parse(jsonStr);

                // 激活看盘面板
                document.getElementById('placeholder').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';

                // 1. 动态渲染文本画像数据（安全对接 C++ 新扩容字段）
                document.getElementById('info-name').innerText = data.realName || data.username;
                document.getElementById('info-uid').innerText = data.account;
                document.getElementById('info-gender').innerText = data.gender || "保密";
                document.getElementById('info-reg-time').innerText = data.regTime || "暂无记录";
                document.getElementById('info-last-login').innerText = data.lastLoginTime || "从未登录";
                document.getElementById('info-last-submit').innerText = data.lastSubmitTime || "暂无提交记录";
                document.getElementById('info-phone').innerText = data.phone || "未绑定";
                document.getElementById('info-email').innerText = data.email || "未绑定";
                document.getElementById('info-idcard').innerText = data.idCard || "未录入";
                document.getElementById('info-motto').innerText = data.motto || "这名学员很懒，什么都没有留下。";

                // 2. 刷新班级名册下拉菜单
                var combo = document.getElementById('combo-class');
                combo.innerHTML = '';
                if (data.allClasses && data.allClasses.length > 0) {
                    data.allClasses.forEach(function(cls) {
                        var opt = document.createElement('option');
                        opt.value = cls;
                        opt.innerText = cls;
                        if (cls === data.className) {
                            opt.selected = true;
                        }
                        combo.appendChild(opt);
                    });
                }

                // 3. 动态激活并注入 ECharts 作战轨迹
                if (!historyChart) {
                    historyChart = echarts.init(document.getElementById('history-chart'));
                }

                historyChart.setOption({
                    title: { text: '最近五次测试情况', textStyle: { color: '#1E293B', fontSize: 32, fontFamily: 'HYWenHei-85W' }, left: 'center' },
                    tooltip: { trigger: 'axis', backgroundColor: 'rgba(30, 41, 59, 0.9)', textStyle: { color: '#F8FAFC' } },
                    grid: { left: '5%', right: '5%', bottom: '10%', top: '18%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: data.historyLabels || [],
                        axisLine: { lineStyle: { color: '#CBD5E1' } },
                        axisLabel: { color: '#64748B', interval: 0, formatter: function(val){ return val.length > 6 ? val.substring(0,5)+'..' : val; } }
                    },
                    yAxis: { type: 'value', min: 0, max: function(value) { return value.max > 100 ? value.max + 10 : 100; }, splitLine: { lineStyle: { type: 'dashed', color: '#E2E8F0' } } },
                    series: [{
                        data: data.historyScores || [],
                        type: 'line',
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 8,
                        itemStyle: { color: '#3B82F6' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(59,130,246,0.4)' },
                                { offset: 1, color: 'rgba(59,130,246,0.0)' }
                            ])
                        },
                        animationDuration: 1000,
                        animationEasing: 'cubicOut'
                    }]
                });

                // 强制响应式重绘，消除隐藏层造成的尺寸塌陷
                setTimeout(function(){ if(historyChart) historyChart.resize(); }, 50);

            } catch(e) { console.error("解析学生历史详情大盘失败:", e); }
        }

        // 向 C++ 回传事件指令
        function actionChangeClass() { if(cplusBridge) cplusBridge.webSignalChangeClass(document.getElementById('combo-class').value); }
        function actionResetPwd() { if(cplusBridge) cplusBridge.webSignalResetPwd(); }
        function actionDeleteStudent() { if(cplusBridge) cplusBridge.webSignalDeleteStudent(); }

        // 窗口尺寸发生变化时自动适配
        window.onresize = function() { if(historyChart) historyChart.resize(); };
    </script>
</body>
</html>
